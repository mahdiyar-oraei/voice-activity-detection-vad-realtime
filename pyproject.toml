[project]
name = "vad-realtime"
version = "0.1.0"
description = "Realtime frame-level VAD (webrtcvad): reusable core + websocket demo server"
requires-python = ">=3.8"
# webrtcvad-wheels is the maintained build of webrtcvad with binary wheels for
# current CPythons (same import name), so slim containers need no compiler.
dependencies = ["webrtcvad-wheels>=2.0.14"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vad_realtime"]
